<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Translation Exporter</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: var(--figma-color-bg, #ffffff);
        --surface: var(--figma-color-bg-secondary, #f7f7f8);
        --surface-strong: var(--figma-color-bg-tertiary, #eeeeef);
        --text: var(--figma-color-text, #1f1f23);
        --text-muted: var(--figma-color-text-secondary, #6b6b74);
        --border: var(--figma-color-border, #d8d8df);
        --brand: var(--figma-color-bg-brand, #0d99ff);
        --brand-soft: rgba(13, 153, 255, 0.1);
        --brand-text: var(--figma-color-text-onbrand, #ffffff);
        --danger: var(--figma-color-text-danger, #d92d20);
        --success: #1f8a4c;
        --shadow: 0 18px 45px rgba(17, 24, 39, 0.08);
        --shadow-soft: 0 8px 24px rgba(17, 24, 39, 0.06);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(13, 153, 255, 0.12), transparent 34%),
          var(--background);
        color: var(--text);
        font-size: 13px;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .app {
        display: block;
        height: 100vh;
        min-height: 0;
      }

      .footer {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: auto minmax(220px, 1fr) auto auto;
        align-items: center;
        gap: 14px;
        margin: 0 16px 16px;
        padding: 18px 20px;
        border-top: 1px solid var(--border);
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(18px);
        box-shadow: 0 -16px 42px rgba(17, 24, 39, 0.14);
      }

      .summary {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.35;
        white-space: nowrap;
      }

      .summary strong {
        color: var(--text);
        font-size: 12px;
        font-weight: 800;
      }

      .summary-reset {
        white-space: nowrap;
      }

      .field {
        display: grid;
        gap: 6px;
        margin: 0;
      }

      .field label {
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
      }

      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 11px;
        background: var(--background);
        color: var(--text);
        outline: none;
        transition:
          border-color 120ms ease,
          box-shadow 120ms ease;
      }

      .field input:focus,
      .field textarea:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(13, 153, 255, 0.12);
      }

      .field textarea {
        min-height: 68px;
        resize: vertical;
      }

      .actions {
        display: grid;
        gap: 8px;
      }

      .export-actions {
        grid-template-columns: 1fr 1fr;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        cursor: pointer;
        background: var(--background);
        color: var(--text);
        font-weight: 700;
        transition:
          transform 120ms ease,
          border-color 120ms ease,
          box-shadow 120ms ease,
          background 120ms ease;
      }

      .button.primary {
        border-color: var(--border);
        background: rgba(255, 255, 255, 0.7);
        color: var(--text);
        box-shadow: none;
      }

      .button.secondary {
        border-color: var(--brand);
        color: var(--brand);
        background: var(--brand-soft);
      }

      .button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: var(--shadow-soft);
      }

      .button.small {
        padding: 6px 9px;
        font-size: 12px;
      }

      .button-icon {
        display: inline-grid;
        place-items: center;
        min-width: 28px;
        height: 22px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.7);
        color: currentColor;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.03em;
      }

      .format-field {
        display: grid;
        gap: 6px;
      }

      .format-field > span {
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
      }

      .format-selector {
        display: flex;
        gap: 10px;
      }

      .format-option input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .format-option span {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 144px;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 9px 14px;
        background: #ffffff;
        font-weight: 800;
      }

      .format-option input:checked + span {
        border-color: #3b82f6;
        box-shadow: 0 0 0 1px #3b82f6 inset;
      }

      .pdf-button .button-icon {
        color: #dc2626;
        background: rgba(220, 38, 38, 0.1);
      }

      .word-button .button-icon {
        color: #2563eb;
        background: rgba(37, 99, 235, 0.1);
      }

      .format-option .pdf-icon,
      .format-option .word-icon {
        display: inline-grid;
        place-items: center;
        min-width: 34px;
        height: 26px;
        border-radius: 8px;
        color: #ffffff;
        font-size: 12px;
      }

      .format-option .pdf-icon {
        background: #ff6b73;
      }

      .format-option .word-icon {
        background: #5aa7f0;
      }

      .link-button {
        justify-self: center;
        border: 0;
        padding: 2px 4px;
        cursor: pointer;
        background: transparent;
        color: var(--brand);
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .toast {
        position: fixed;
        right: 24px;
        bottom: 116px;
        left: 24px;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid rgba(217, 45, 32, 0.25);
        border-radius: 14px;
        background: #fff5f4;
        color: var(--danger);
        box-shadow: var(--shadow);
      }

      .toast[hidden] {
        display: none;
      }

      .toast p {
        margin: 0;
        line-height: 1.35;
      }

      .toast button {
        border: 0;
        cursor: pointer;
        background: transparent;
        color: var(--danger);
        font-size: 18px;
      }

      .main {
        min-width: 0;
        min-height: 0;
        height: 100vh;
        overflow: auto;
        padding: 28px 28px 132px;
      }

      .blocks {
        max-width: 1040px;
        margin: 0 auto;
      }

      .app-header {
        display: grid;
        gap: 4px;
        justify-items: center;
        margin: 0 0 22px;
        text-align: center;
      }

      .app-header h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.04em;
      }

      .app-header p {
        margin: 0;
        color: var(--text-muted);
        line-height: 1.45;
      }

      .blocks-header {
        margin-bottom: 12px;
        padding: 2px 2px 4px;
      }

      .blocks-header h2 {
        margin: 0;
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .translation-block {
        display: grid;
        gap: 16px;
        margin-bottom: 18px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: var(--shadow);
      }

      .translation-block.complete {
      }

      .block-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .block-title {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .block-name-input {
        width: min(320px, 100%);
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 7px 9px;
        background: transparent;
        color: var(--text);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.02em;
        outline: none;
      }

      .block-name-input:hover,
      .block-name-input:focus {
        border-color: var(--border);
        background: rgba(255, 255, 255, 0.76);
      }

      .complete-check {
        position: relative;
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: #0bb500;
        box-shadow: 0 8px 18px rgba(11, 181, 0, 0.25);
      }

      .complete-check::before {
        content: "";
        width: 13px;
        height: 7px;
        border-bottom: 3px solid #ffffff;
        border-left: 3px solid #ffffff;
        transform: translateY(-1px) rotate(-45deg);
      }

      .block-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(180px, 1fr));
        gap: 16px;
        align-items: start;
      }

      .block-panel {
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
        min-height: 220px;
        padding: 22px;
        border: 1.5px dashed var(--border);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.58);
        text-align: center;
      }

      .step-title {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .screen-image {
        width: 100%;
        max-height: 240px;
        object-fit: contain;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #ffffff;
      }

      .empty-note {
        margin: 0;
        color: var(--text-muted);
        line-height: 1.45;
      }

      .table-wrapper {
        display: grid;
        gap: 8px;
        justify-self: stretch;
        overflow: auto;
        max-height: 240px;
        text-align: left;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--background);
      }

      th {
        padding: 10px;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, #6b7280, #52525b);
        color: #ffffff;
        text-align: left;
      }

      td {
        min-width: 120px;
        padding: 10px;
        border: 1px solid var(--border);
        vertical-align: top;
        line-height: 1.35;
      }

      .add-block {
        width: 100%;
        margin-top: 2px;
      }

      .workflow-help {
        margin: 16px auto 0;
        color: var(--text-muted);
        text-align: center;
        line-height: 1.45;
      }

      @media (max-width: 760px) {
        .footer {
          grid-template-columns: 1fr;
          align-items: stretch;
        }

        .main {
          padding: 18px 18px 300px;
        }

        .panel {
          bottom: 130px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="main">
        <div id="blocksContainer" class="blocks"></div>
      </section>

      <footer class="footer">
        <div id="exportSummary" class="summary"></div>

        <div class="field">
          <label for="filenameInput">Nombre del archivo</label>
          <input id="filenameInput" type="text" placeholder="traducciones-ui" />
        </div>

        <div class="format-field">
          <span>Formato</span>
          <div class="format-selector" role="radiogroup" aria-label="Formato de exportacion">
            <label class="format-option">
              <input type="radio" name="exportFormat" value="docx" checked />
              <span><span class="word-icon">W</span> Word</span>
            </label>
            <label class="format-option">
              <input type="radio" name="exportFormat" value="pdf" />
              <span><span class="pdf-icon">PDF</span> PDF</span>
            </label>
          </div>
        </div>

        <button id="exportButton" class="button primary" type="button" disabled>
          Exportar 0 bloques
        </button>
      </footer>
      <div id="toast" class="toast" hidden role="alert">
        <p id="toastMessage"></p>
        <button id="toastCloseButton" type="button" aria-label="Cerrar error">&times;</button>
      </div>
    </main>
    <script src="./ui.js"></script>
  </body>
</html>
