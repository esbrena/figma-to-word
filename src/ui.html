<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Translation Exporter</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: var(--figma-color-bg, #ffffff);
        --surface: var(--figma-color-bg-secondary, #f7f7f8);
        --surface-strong: var(--figma-color-bg-tertiary, #eeeeef);
        --text: var(--figma-color-text, #1f1f23);
        --text-muted: var(--figma-color-text-secondary, #6b6b74);
        --border: var(--figma-color-border, #d8d8df);
        --brand: var(--figma-color-bg-brand, #0d99ff);
        --brand-soft: rgba(13, 153, 255, 0.1);
        --brand-text: var(--figma-color-text-onbrand, #ffffff);
        --danger: var(--figma-color-text-danger, #d92d20);
        --success: #1f8a4c;
        --shadow: 0 18px 45px rgba(17, 24, 39, 0.08);
        --shadow-soft: 0 8px 24px rgba(17, 24, 39, 0.06);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(13, 153, 255, 0.12), transparent 34%),
          var(--background);
        color: var(--text);
        font-size: 13px;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-areas: "sidebar main";
        grid-template-columns: 330px minmax(0, 1fr);
        height: 100vh;
        min-height: 0;
      }

      .sidebar {
        grid-area: sidebar;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 18px 16px;
        border-right: 1px solid var(--border);
        background: rgba(247, 247, 248, 0.86);
        backdrop-filter: blur(18px);
        overflow: auto;
      }

      .sidebar h1 {
        margin: 0 0 4px;
        font-size: 21px;
        letter-spacing: -0.03em;
      }

      .sidebar p {
        margin: 0;
        color: var(--text-muted);
        line-height: 1.45;
      }

      .panel {
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: var(--shadow-soft);
      }

      .panel h2 {
        margin: 0 0 11px;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .summary {
        display: grid;
        gap: 8px;
        line-height: 1.35;
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 0;
        border-bottom: 1px solid var(--border);
      }

      .summary-row:last-child {
        border-bottom: 0;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-top: 12px;
      }

      .field label {
        color: var(--text-muted);
        font-size: 12px;
      }

      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 11px;
        background: var(--background);
        color: var(--text);
        outline: none;
        transition:
          border-color 120ms ease,
          box-shadow 120ms ease;
      }

      .field input:focus,
      .field textarea:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(13, 153, 255, 0.12);
      }

      .field textarea {
        min-height: 68px;
        resize: vertical;
      }

      .actions {
        display: grid;
        gap: 8px;
      }

      .export-actions {
        grid-template-columns: 1fr 1fr;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        cursor: pointer;
        background: var(--background);
        color: var(--text);
        font-weight: 700;
        transition:
          transform 120ms ease,
          border-color 120ms ease,
          box-shadow 120ms ease,
          background 120ms ease;
      }

      .button.primary {
        border-color: var(--brand);
        background: var(--brand);
        color: var(--brand-text);
        box-shadow: 0 10px 22px rgba(13, 153, 255, 0.2);
      }

      .button.secondary {
        border-color: var(--brand);
        color: var(--brand);
        background: var(--brand-soft);
      }

      .button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: var(--shadow-soft);
      }

      .button.small {
        padding: 6px 9px;
        font-size: 12px;
      }

      .button-icon {
        display: inline-grid;
        place-items: center;
        min-width: 28px;
        height: 22px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.22);
        color: currentColor;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.03em;
      }

      .link-button {
        justify-self: center;
        border: 0;
        padding: 2px 4px;
        cursor: pointer;
        background: transparent;
        color: var(--brand);
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .status {
        min-height: 38px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--text-muted);
        line-height: 1.35;
      }

      .status[data-state="error"] {
        color: var(--danger);
      }

      .main {
        grid-area: main;
        min-width: 0;
        min-height: 0;
        height: 100vh;
        overflow: auto;
        padding: 28px;
      }

      .blocks {
        max-width: 1040px;
        margin: 0 auto;
      }

      .blocks-header {
        margin-bottom: 12px;
        padding: 2px 2px 4px;
      }

      .blocks-header h2 {
        margin: 0;
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .translation-block {
        display: grid;
        gap: 16px;
        margin-bottom: 18px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: var(--shadow);
      }

      .translation-block.complete {
      }

      .block-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .block-title {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .block-name-input {
        width: min(320px, 100%);
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 7px 9px;
        background: transparent;
        color: var(--text);
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
        outline: none;
      }

      .block-name-input:hover,
      .block-name-input:focus {
        border-color: var(--border);
        background: rgba(255, 255, 255, 0.76);
      }

      .complete-check {
        position: relative;
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: #0bb500;
        box-shadow: 0 8px 18px rgba(11, 181, 0, 0.25);
      }

      .complete-check::before {
        content: "";
        width: 13px;
        height: 7px;
        border-bottom: 3px solid #ffffff;
        border-left: 3px solid #ffffff;
        transform: translateY(-1px) rotate(-45deg);
      }

      .block-grid {
        display: grid;
        grid-template-columns: minmax(260px, 0.9fr) minmax(340px, 1.1fr);
        gap: 16px;
        align-items: start;
      }

      .block-panel {
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
        min-height: 220px;
        padding: 22px;
        border: 1.5px dashed var(--border);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.58);
        text-align: center;
      }

      .step-title {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .screen-image {
        width: 100%;
        max-height: 360px;
        object-fit: contain;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #ffffff;
      }

      .empty-note {
        margin: 0;
        color: var(--text-muted);
        line-height: 1.45;
      }

      .table-wrapper {
        display: grid;
        gap: 8px;
        justify-self: stretch;
        overflow: auto;
        text-align: left;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--background);
      }

      th {
        padding: 10px;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, #6b7280, #52525b);
        color: #ffffff;
        text-align: left;
      }

      td {
        min-width: 120px;
        padding: 10px;
        border: 1px solid var(--border);
        vertical-align: top;
        line-height: 1.35;
      }

      .add-block {
        width: 100%;
        margin-top: 2px;
      }

      @media (max-width: 760px) {
        .app {
          grid-template-areas:
            "main"
            "sidebar";
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) auto;
          height: 100vh;
          overflow: hidden;
        }

        .block-grid {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: 0;
          border-top: 1px solid var(--border);
          border-bottom: 0;
          max-height: 42vh;
          padding: 12px;
          box-shadow: 0 -18px 45px rgba(17, 24, 39, 0.08);
        }

        .sidebar > div:first-child {
          display: none;
        }

        .main {
          height: auto;
          padding: 16px;
        }

        .panel {
          padding: 12px;
        }

        .export-actions {
          grid-template-columns: 1fr 1fr;
        }

        .utility-actions {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 430px) {
        .export-actions,
        .utility-actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div>
          <h1>UI Translation Exporter</h1>
          <p>Exporta pantallas UI junto a sus tablas de traduccion.</p>
        </div>

        <section class="panel">
          <h2>Resumen de exportacion</h2>
          <div id="exportSummary" class="summary"></div>
        </section>

        <section class="panel">
          <h2>Exportar</h2>
          <div class="field" style="margin-top: 0">
            <label for="filenameInput">Nombre del archivo</label>
            <input id="filenameInput" type="text" placeholder="traducciones-ui" />
          </div>
          <div class="actions export-actions" style="margin-top: 12px">
            <button id="exportPdfButton" class="button primary" type="button" disabled>
              <span class="button-icon">PDF</span>
              Exportar
            </button>
            <button id="exportDocxButton" class="button primary" type="button" disabled>
              <span class="button-icon">W</span>
              Word
            </button>
          </div>
          <div class="actions utility-actions" style="margin-top: 8px">
            <button id="resetButton" class="button" type="button" disabled>
              Resetear
            </button>
            <button id="closeButton" class="button" type="button">Cerrar</button>
          </div>
        </section>

        <div id="statusMessage" class="status" data-state="info">
          Completa un bloque con pantalla y tabla para habilitar la exportacion.
        </div>
      </aside>

      <section class="main">
        <div id="blocksContainer" class="blocks"></div>
      </section>
    </main>
    <script src="./ui.js"></script>
  </body>
</html>
