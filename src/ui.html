<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figma to Word/PDF</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: var(--figma-color-bg, #ffffff);
        --surface: var(--figma-color-bg-secondary, #f7f7f8);
        --surface-strong: var(--figma-color-bg-tertiary, #eeeeef);
        --text: var(--figma-color-text, #1f1f23);
        --text-muted: var(--figma-color-text-secondary, #6b6b74);
        --border: var(--figma-color-border, #d8d8df);
        --brand: var(--figma-color-bg-brand, #0d99ff);
        --brand-text: var(--figma-color-text-onbrand, #ffffff);
        --danger: var(--figma-color-text-danger, #d92d20);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-size: 13px;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 20px;
        border-right: 1px solid var(--border);
        background: var(--surface);
      }

      .sidebar h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }

      .sidebar p {
        margin: 0;
        color: var(--text-muted);
        line-height: 1.45;
      }

      .panel {
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--background);
      }

      .panel h2 {
        margin: 0 0 10px;
        font-size: 13px;
      }

      .selection-summary {
        display: flex;
        flex-direction: column;
        gap: 6px;
        line-height: 1.35;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-top: 12px;
      }

      .field label {
        color: var(--text-muted);
        font-size: 12px;
      }

      .field input,
      .field select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 10px;
        background: var(--background);
        color: var(--text);
      }

      .actions {
        display: grid;
        gap: 10px;
      }

      .button {
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 10px 12px;
        cursor: pointer;
        background: var(--background);
        color: var(--text);
        font-weight: 600;
      }

      .button.primary {
        border-color: var(--brand);
        background: var(--brand);
        color: var(--brand-text);
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .status {
        min-height: 34px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--surface-strong);
        color: var(--text-muted);
        line-height: 1.35;
      }

      .status[data-state="error"] {
        color: var(--danger);
      }

      .preview {
        min-width: 0;
        max-height: 100vh;
        overflow: auto;
        padding: 24px;
      }

      .empty-preview,
      .document-preview {
        max-width: 760px;
        margin: 0 auto;
      }

      .empty-preview {
        display: grid;
        gap: 12px;
        padding: 36px;
        border: 1px dashed var(--border);
        border-radius: 18px;
        color: var(--text-muted);
      }

      .empty-preview h2,
      .document-header h2,
      .frame-heading h3 {
        margin: 0;
        color: var(--text);
      }

      .empty-preview ol {
        margin: 0;
        padding-left: 18px;
        line-height: 1.7;
      }

      .document-header {
        margin-bottom: 22px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .frame-preview {
        display: grid;
        gap: 18px;
        margin-bottom: 26px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
      }

      .frame-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .frame-heading span {
        color: var(--text-muted);
        white-space: nowrap;
      }

      .frame-image {
        width: 100%;
        max-height: 420px;
        object-fit: contain;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #ffffff;
      }

      .preview-section h4 {
        margin: 0 0 10px;
        font-size: 13px;
      }

      .text-block-list {
        display: grid;
        gap: 10px;
      }

      .text-block {
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--background);
      }

      .text-block span {
        display: block;
        margin-bottom: 6px;
        color: var(--text-muted);
        font-size: 11px;
      }

      .text-block p {
        margin: 0;
        line-height: 1.45;
        white-space: normal;
      }

      .table-wrapper {
        display: grid;
        gap: 8px;
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--background);
      }

      td {
        min-width: 120px;
        padding: 8px;
        border: 1px solid var(--border);
        vertical-align: top;
      }

      .image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }

      figure {
        margin: 0;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--background);
      }

      figure img {
        width: 100%;
        height: 110px;
        object-fit: contain;
      }

      figcaption,
      .empty-note {
        color: var(--text-muted);
      }

      @media (max-width: 760px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div>
          <h1>Figma to Word/PDF</h1>
          <p>
            Exporta frames como documento con captura visual y textos copiables para
            desarrollo.
          </p>
        </div>

        <section class="panel">
          <h2>1. Selecciona frames</h2>
          <div id="selectionSummary" class="selection-summary">
            <strong>Cargando seleccion...</strong>
          </div>
        </section>

        <section class="panel">
          <h2>2. Genera y exporta</h2>
          <div class="actions">
            <button id="generateButton" class="button primary" type="button" disabled>
              Generar
            </button>
          </div>

          <div class="field">
            <label for="filenameInput">Nombre del archivo</label>
            <input id="filenameInput" type="text" placeholder="nombre-del-documento" />
          </div>

          <div class="field">
            <label for="formatSelect">Formato</label>
            <select id="formatSelect">
              <option value="pdf">PDF</option>
              <option value="docx">Word (.docx)</option>
            </select>
          </div>

          <div class="actions" style="margin-top: 12px">
            <button id="exportButton" class="button primary" type="button" disabled>
              Exportar
            </button>
            <button id="closeButton" class="button" type="button">Cerrar</button>
          </div>
        </section>

        <div id="statusMessage" class="status" data-state="info">
          Selecciona frames para empezar.
        </div>
      </aside>

      <section id="previewContainer" class="preview" aria-live="polite"></section>
    </main>
    <script src="./ui.js"></script>
  </body>
</html>
